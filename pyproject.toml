[project]
name = "klip"
version = "0.1.0"
description = "Prompt -> short vertical video pipeline: scene spec JSON -> Indonesian voiceover, word-synced captions, b-roll, HyperFrames render."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["tiktok", "video", "tts", "captions", "hyperframes", "mcp", "claude"]
dependencies = [
    "edge-tts==7.3.1",
    "jinja2>=3.1",
    "mcp>=2.3",
    "pillow>=10.4",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/aliflazuardi/klip"
Issues = "https://github.com/aliflazuardi/klip/issues"
Changelog = "https://github.com/aliflazuardi/klip/blob/main/CHANGELOG.md"

[project.scripts]
klip = "klip.cli:app"
klip-mcp = "klip.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["klip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
