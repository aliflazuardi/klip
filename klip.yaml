# ─────────────────────────────────────────────────────────────────────────────
# Klip configuration: every tunable setting lives in this one file.
#
# Secrets (API keys) do NOT go here; they go in .env (see .env.example).
# Per-video choices (voice, speech_rate, style, music mood, visuals) go in the spec JSON.
# Override this file's location with KLIP_CONFIG=/path/to/klip.yaml.
# ─────────────────────────────────────────────────────────────────────────────

# ── Voice (TTS) ──────────────────────────────────────────────────────────────
voices:
  # TTS engine: edge (free, Microsoft Edge voices) | elevenlabs (ELEVENLABS_API_KEY, paid, most
  # natural, returns word timings) | gemini (GEMINI_API_KEY, natural, style-prompted; word timings
  # come from the aligner: `uv sync --extra align`). Compare them: uv run klip ab-voice <spec>
  engine: edge
  # klip preview records with this engine instead (a draft voice: free, no quota), unless every take of
  # `engine` is already cached; the stills follow the draft's word times. null = preview with `engine`.
  preview_engine: edge
  # scene = one TTS call per scene (per-scene delivery presets, but intonation restarts each
  # scene); whole = the whole script in one call, cut into scenes at the pauses: one continuous,
  # natural read (delivery presets don't apply; ElevenLabs/Gemini carry the energy themselves).
  take: scene
  ids:                              # logical voice → engine voice id
    edge:
      male: id-ID-ArdiNeural
      female: id-ID-GadisNeural
    elevenlabs:                     # premade multilingual voices; swap in Indonesian voices from
      male: JBFqnCBsd6RMkjVDRZzb    # the ElevenLabs voice library (George)
      female: EXAVITQu4vr4xnSDxMaL  # (Sarah)
    gemini:                         # prebuilt voices: Puck (upbeat), Charon (informative), Kore
      male: Puck                    # (firm), Aoede (breezy), Sulafat (warm), Achird (friendly)...
      female: Aoede
  # Rate used when a spec leaves `speech_rate` unset. Gadis reads slower than Ardi.
  default_rate:
    male: "+8%"
    female: "+15%"
  # Shift applied to word timings (ms) so captions match the audible onset.
  # edge-tts word offsets run ~115 ms early (measured with scripts/check_sync.py).
  # The first word after a pause starts where the sound resumes: words timed up to this late after
  # a pause are pulled back to it (aligned engines like Gemini time those words ~0.1-0.2 s late).
  snap_late_ms: 300
  timing_offset_ms:
    edge: 100
    elevenlabs: 0
    gemini: 0
  # Words per second at +0% rate, used for duration estimates and script word budgets.
  # Measured: female 1.97 w/s at +15%, male 2.35 w/s at +8%.
  base_words_per_second:
    male: 2.176
    female: 1.713

# ElevenLabs engine (voices.engine: elevenlabs). Voice settings: lower stability = livelier.
elevenlabs:
  model: eleven_multilingual_v2     # or eleven_v3 (more expressive)
  language_code: null               # e.g. "id" to force Indonesian (ignored by multilingual_v2)
  stability: 0.4
  similarity_boost: 0.75
  style: 0.2                        # style exaggeration (0 = off)
  speed_range: [0.8, 1.2]           # the voice's rate (+8% → 1.08) is clamped to this

# Gemini TTS engine (voices.engine: gemini). `style` steers delivery (pace, mood, accent); the
# text itself is read verbatim.
gemini_tts:
  model: gemini-3.8-flash-tts
  max_wait_s: 70                    # on a rate limit (HTTP 429), wait what the API asks, up to this
  # A two-voice video (a duet: scenes alternate female and male) is recorded as ONE multi-speaker
  # request instead of one per narrator turn (needs voices.take: whole): fewer requests on the
  # free tier, and the hand-offs flow like a real conversation. false = one request per turn.
  dialogue: true
  style: >-
    Narator video edukasi pendek berbahasa Indonesia untuk TikTok: santai, hangat, penasaran,
    seperti ngobrol dengan teman, tempo agak cepat, logat Jakarta yang netral.

# Forced alignment for engines without word timings (Gemini): faster-whisper word timestamps,
# mapped onto the script. Optional: `uv sync --extra align` (downloads the model on first use).
align:
  model: small                      # tiny | base | small | medium (bigger = slower, steadier)
  device: cpu
  compute_type: int8
  language: id
  # Whisper word starts run early: measured -90 ms mean against edge-tts's own timings on the
  # judol script (238 words; median error 82 ms). Added to every aligned word.
  offset_ms: 85

# ── Delivery (per-scene prosody) ─────────────────────────────────────────────
# edge-tts reads everything in one flat tone; varying rate/pitch per scene makes it livelier.
# Each preset shifts the voice's base rate (added to voices.default_rate / spec speech_rate)
# and pitch/volume. A scene picks one with "delivery"; otherwise by_template decides.
# Try one with: uv run klip say "Pernah nggak kamu…?" --delivery energetic
prosody:
  enabled: true
  presets:
    neutral:   {rate: "+0%", pitch: "+0Hz", volume: "+0%"}
    energetic: {rate: "+6%", pitch: "+8Hz", volume: "+5%"}    # hooks: quicker, brighter
    emphatic:  {rate: "-4%", pitch: "+4Hz", volume: "+5%"}    # the key fact/number: slower, firmer
    warm:      {rate: "-6%", pitch: "-4Hz", volume: "+0%"}    # outro: relaxed, friendly
    calm:      {rate: "-8%", pitch: "-6Hz", volume: "-5%"}
  by_template:
    hook: energetic
    stat: emphatic
    myth_fact: emphatic
    cta: warm
  default: neutral

# ── Pronunciation lexicon ────────────────────────────────────────────────────
# Applied to the spoken (TTS) text only; captions keep the original spelling.
# Word keys match whole words; symbol keys ("%") match anywhere.
# Test a fix with: uv run klip say "teks kamu" --voice female
lexicon:
  WiFi: wai fai
  vs: versus
  "%": persen
  km/jam: kilometer per jam
  Follow: folo
  follow: folo
  TikTok: tik tok
  online: onlain
  update: apdet

# ── Scene timeline ───────────────────────────────────────────────────────────
timeline:
  gap_ms: 150                       # silence between scenes
  tail_ms: 1000                     # hold after the last scene
  min_scene_ms: 1500
  hook_lead_ms: 60                  # trim the TTS lead-in so the hook's first word starts ~60 ms in
  turn_gap_ms: 250                  # whole takes: extra pause where the narrator changes (a scene "voice")

# ── Stock media / b-roll ─────────────────────────────────────────────────────
assets:
  # Tried in this order per scene. pexels/pixabay are skipped without their .env key.
  providers: [local, pexels, pixabay, openverse]
  local_dir: assets/broll           # your own clips, matched by folder/file names
  download_tries: 3                 # candidates tried per provider before moving on
  # Relevance gate: a result's tags must contain this share of the query's words, else it's
  # skipped (falls back to photos, then the scene's icon). Raise for stricter matching.
  min_relevance: 0.5
  # Smallest rendition whose 9:16 center crop covers this much of 1080×1920 (1440p ≈ 0.75).
  rendition_min_fill: 0.74
  # Below this, a center crop would be too soft → blurred-background fill instead.
  cover_min_fill: 0.6
  api_cache_hours: 24               # Pixabay terms require caching responses 24 h
  unsplash_px: 1600                 # longest side of a downloaded Unsplash photo
  # Claude looks at numbered thumbnail sheets of each scene's candidates before downloading,
  # keeps the ones that actually show the narration, ranks them, and can rescue a few results
  # the tag gate dropped. One `claude -p` call per video (your Claude plan, ~30-90 s). Falls back
  # to tag-based selection if the CLI is missing, not logged in, or the call fails.
  vision_check:
    enabled: true
    candidates_per_scene: 8         # thumbnails per sheet
    candidates_per_prop: 8          # thumbnails per stage prop (cutout/photo element); best rated is used
    photo_slots: 3                  # of those, reserved for stock photos (they often match better)
    min_score: 2                    # Claude rates 0-3 (3 shows the subject, 2 closely related, 1 generic)
    extra_untagged: 2               # per query: tag-gate rejects Claude may still approve
    model: null                     # null = llm.claude.model / CLI default; "haiku" is faster/cheaper
    timeout_s: 300

# ── Cuts: several shots per b-roll scene ─────────────────────────────────────
# Every shot shows its own clip: a source is used once per video and never looped. Scenes with
# visual.beats cut on each beat's anchor word (one clip per beat). Without beats, a scene is split
# into shots of ~target_shot_s on word boundaries (preferably after punctuation), but only into as
# many shots as it has distinct clips. A spec can cap a scene with visual.max_shots (1 = no cuts).
cuts:
  target_shot_s: 2.5
  min_shot_s: 1.4                   # beats closer together than this are dropped
  max_shots_per_scene: 4
  clips_per_scene: 3                # distinct clips fetched per scene without beats
  cut_zoom: 1.12                    # each new shot punches in from this scale
  min_speed: 0.6                    # a clip shorter than its shot slows to this, then holds its last frame
  max_shot_s: 6.0                   # QA reports shots longer than this (they feel static); add beats

# ── Stage scenes (visual.type "stage") ──────────────────────────────────────
# A collage that builds up on a persistent background (90secondslab style): cut-out photos,
# icons, labels, numbers and charts pop in on their narration words and stay. Consecutive stage
# scenes with the same background keep it on screen (no whoosh; the props sweep off instead).
stage:
  default_background: grid
  # Spec "look": "stage" (klip new --stage) asks for the stage look on most of the video: at least
  # this share of the scenes that can hold a stage (hook, explain, list_item) must use it.
  look_min_share: 0.7
  # Built-in sets (CSS + SVG noise, no downloads). base = colour, tone = light | dark surface
  # (picks the title/tag colours), grain = noise opacity, grain_freq = SVG feTurbulence
  # baseFrequency ("x y"; a tiny y gives wood-like streaks), vignette = edge darkening (0-1).
  # Optional: dots = dot grid {gap px, size px, color}; floor = a wall over a desk {at: share of
  # the height where the desk starts, color}; spot = a soft light {color, at, size} (CSS radial);
  # planks = px between plank seams.
  # grid / studio / spotlight are the clean sets (90secondslab-like); desk / paper / kraft / board
  # are the original textured ones.
  backgrounds:
    grid:      {base: "#F3F1EC", tone: light, grain: 0.05, grain_freq: "0.9 0.9", vignette: 0.10,
                dots: {gap: 34, size: 2.6, color: "rgba(21,21,28,.17)"}}
    studio:    {base: "#ECE7E0", tone: light, grain: 0.08, grain_freq: "0.02 0.5", vignette: 0.20,
                floor: {at: 0.34, color: "#CFB290"}}
    spotlight: {base: "#17161A", tone: dark, grain: 0.10, grain_freq: "0.8 0.8", vignette: 0.30,
                spot: {color: "rgba(255,238,210,.26)", at: "50% 48%", size: "75% 45%"}}
    desk:  {base: "#A86F42", tone: dark, grain: 0.38, grain_freq: "0.012 0.32", planks: 270, vignette: 0.45}
    paper: {base: "#F4EEE2", tone: light, grain: 0.10, grain_freq: "0.9 0.9", vignette: 0.18}
    kraft: {base: "#C9A273", tone: light, grain: 0.20, grain_freq: "0.7 0.7", vignette: 0.30}
    board: {base: "#25343A", tone: dark, grain: 0.16, grain_freq: "0.8 0.8", vignette: 0.40}
  bg_drift_px: 40                   # the background pans this far across a run of stage scenes
  # Backdrops (visual.backdrop): themed sets instead of a plain background, as 90secondslab swaps
  # sets with the story (apothecary shelves, the IDX board, an old Kaskus page, an m-banking
  # screen, an old map). Per kind: dim = darkening (0-0.9) so props and captions read on it,
  # blur = px (photo/screenshot; baked into the prepared file), tone = which title/tag colours,
  # title = the title style on this set (box = caps in dark boxes, readable on a busy picture),
  # shade = extra darkening toward the bottom, where the captions sit (0-1).
  # board: a dense grid of `items` (base = board colour, ink = plain cells, up/down = cells with a
  # +/- number, stripe = alternate rows, cols = columns, font_px / row_px = cell type and row height). phone: an app screen
  # (base, bar = status-bar/header ink; the header sits at header_top px).
  backdrop:
    photo:      {dim: 0.38, blur: 2, tone: dark, title: box, shade: 0.55}
    screenshot: {dim: 0.42, blur: 1, tone: dark, title: box, shade: 0.6}
    board:      {dim: 0.30, tone: dark, title: box, shade: 0.6, base: "#0B0D10", ink: "#C9CED6", up: "#22C55E",
                 down: "#EF4444", stripe: "#1A1D23", cols: 3, font_px: 30, row_px: 60, header_top: 236}
    phone:      {dim: 0, tone: dark, title: plain, shade: 0, base: "#0E1013", bar: "#9AA0A6", header_top: 236}
    size: [1200, 2040]              # px a photo/screenshot set is prepared at (the frame plus the pan)
    tint_opacity: 0.5               # strength of a `tint` colour wash (multiplied over the set)
    query_suffix: background        # photo sets search "<query> background" first, then the plain query
  # validate suggests switching sets when a video has at least variety_scenes stage scenes but
  # fewer than variety_min_sets different sets (backgrounds and backdrops).
  variety_scenes: 5
  variety_min_sets: 2
  zoom: 1.04                        # the stage camera slowly pushes in to this scale per scene
  # Motion of the props once they're on stage. float: an idle sway (px up/down by prop group:
  # media = photos/cut-outs/people/logos, icon = icons/stacks, tag = labels/numbers, data =
  # charts/bars/units/news/screenshots; 0 = still) over a period picked per prop from
  # float_period_s, starting settle_s after the prop lands. camera_follow: on each entry the camera
  # eases this share of the way toward the props on stage (0 = a plain push-in), over camera_move_s.
  # count_up: numbers like "Rp12.000" or "-4%" count up as they land. exit: sweep (props fly off
  # to their side) or fade (shrink and drop).
  motion:
    float_px: {media: 7, icon: 9, tag: 4, data: 2}
    float_deg: 1.2
    float_period_s: [2.4, 3.4]
    settle_s: 0.55
    camera_follow: 0.12
    camera_move_s: 0.9
    count_up: true
    count_s: 0.7
    exit: sweep
  # Layout: the stage area sits between the title and the stage captions (caption.stage.top).
  # A composition is a list of [x, y, size]: x as a share of the safe width (x 60–960), y as a
  # share of the free area under the title, so a two-line title pushes the props down.
  # `auto` picks one by how many props share the stage and which kinds they are:
  # 1 → hero; 2 → hero_tag (a photo/chart + a small tag, number or icon) or pair;
  # 3 → hero_two (one big prop + two small) or trio; 4 → grid4; 5 → scatter5; 6 → scatter6.
  compositions:
    hero:     [[0.5, 0.5, l]]
    hero_tag: [[0.42, 0.42, l], [0.82, 0.86, s]]
    pair:     [[0.27, 0.5, m], [0.73, 0.5, m]]
    hero_two: [[0.5, 0.38, l], [0.2, 0.9, s], [0.8, 0.9, s]]
    trio:     [[0.27, 0.25, m], [0.73, 0.25, m], [0.5, 0.78, m]]
    grid4:    [[0.27, 0.25, m], [0.73, 0.25, m], [0.27, 0.77, m], [0.73, 0.77, m]]
    scatter5: [[0.24, 0.17, s], [0.76, 0.17, s], [0.5, 0.5, m], [0.24, 0.84, s], [0.76, 0.84, s]]
    scatter6: [[0.22, 0.17, s], [0.78, 0.17, s], [0.22, 0.52, s], [0.78, 0.52, s], [0.24, 0.86, s], [0.76, 0.86, s]]
  # `pos` on an element overrides its place: a t/m/b row + l/c/r column (e.g. tl, mc, br).
  columns: {l: 290, c: 510, r: 730}  # x centres on the canvas
  rows: {t: 0.2, m: 0.5, b: 0.8}    # y centres as a share of the free area
  sizes:
    s: [360, 300]                   # bounding box (w, h) px for cutout/photo/bar/stack
    m: [470, 420]
    l: [820, 640]
  icon_px: {s: 190, m: 250, l: 340} # icon sticker disc diameter
  number_px: {s: 130, m: 180, l: 260}   # number font size
  label_px: {s: 44, m: 54, l: 66}  # label (tag) font size
  stamp_px: {s: 64, m: 84, l: 110} # stamp font size
  tilt_deg: 4                       # props are rotated up to ± this (deterministic per element)
  caption_gap_px: 50                # the stage area ends this far above the captions (room for the
                                    # camera push-in and hanging label tags)
  layout_gap_px: 16                 # props on one page keep at least this apart (overlaps are pushed
                                    # apart, then shrunk); stamps may overlap what they judge
  lead_s: 0.06                      # an element lands this long before its word
  min_gap_s: 0.25                   # entries closer than this are pushed apart
  exit_s: 0.25                      # props sweep off this long before a cleared stage / stage→stage cut
  lint_min_gap_s: 0.5               # validate warns when two anchors are closer than this
  lint_max_gap_s: 3.0               # ... and when nothing new appears for longer than this
  stack_count: 4                    # stack elements without `count`
  title:                            # the scene's on_screen_text at the top of the stage
    style: plain                    # plain = left-aligned type with a marker on emphasis words;
                                    # strip = the older centred white paper strip; box = caps in dark
                                    # boxes, emphasis in an accent box (backdrops pick theirs)
    top: 330
    font_size: 62
    hook_font_size: 80
    ink: {light: "#15151C", dark: "#F6F1E7"}   # plain text colour by the background's tone
    marker: null                    # emphasis marker colour; null = the style's accent_color
    bg: "#FFFFFF"                   # strip only
    color: "#15151C"                # strip only
    tilt_deg: -1.5                  # strip only
    box: {bg: "#15151C", color: "#FFFFFF", emph_color: null}   # box only; emph_color null = the style's
                                    # text-on-accent colour; the emphasis box is the accent colour
  label:                            # tags: dark on light sets, light on dark sets
    light: {bg: "#15151C", color: "#FFFFFF"}
    dark: {bg: "#FFFFFF", color: "#15151C"}
    uppercase: true
  stamp: {neutral: "#15151C", neutral_dark: "#F6F1E7", up: "#1FA45B", down: "#D93A3F", border_px: 9}   # neutral_dark: on dark sets
  shadow:                           # prop drop shadow by the background's tone
    light: "0 16px 18px rgba(0,0,0,.20)"
    dark: "0 18px 22px rgba(0,0,0,.42)"
  highlight: {color: "#FFE14D", width: 10, pad: 18}
  icon: {bg: "#FFFFFF", color: "#15151C"}
  number: {neutral: "#15151C", up: "#1FA45B", down: "#E5484D", stroke: "#FFFFFF"}   # by `tone`; white sticker outline
  bar: {colors: ["#3B82F6", "#F59E0B", "#10B981", "#EF4444"], bg: "#FFFFFF", text: "#15151C"}
  # Motion components: animated diagrams on the stage whose `steps` play on their own words.
  # width = box width by size (l is the full safe width); aspect = height / width per kind (a page
  # that also holds other props shrinks it to fit). Steps without an `at` word come step_gap_s
  # after the previous one; the first comes first_step_s after the element appears.
  # colors = the parts' fills (split, funnel, flow), "accent" = the style's accent colour; a step
  # with `accent: true` always gets the accent.
  components:
    width: {s: 460, m: 680, l: 900}
    pad: 0.05                       # card padding as a share of the width (kinetic has no card)
    card: "#FFFFFF"
    ink: "#15151C"
    muted: "#6B7280"
    track: "#E4E6EB"                # empty tube / unrevealed bar / flow base
    colors: ["#2F3A4A", "#64748B", "#94A3B8", "#CBD5E1", "#475569"]
    step_gap_s: 0.45
    first_step_s: 0.35
    min_step_s: 0.25
    kinetic: {aspect: 0.75, max_px: 150}
    split: {aspect: 0.7}
    flow: {aspect: 1.05, min_px: 8, max_px: 46, dash: 4, gap: 30, speed_s: 0.6}   # dots: dash/gap px; speed = s per gap
    meter: {aspect: 0.9, fill_s: 0.8}
    cycle: {aspect: 1.0, orbit_s: 2.6}   # one lap of the dot once the loop is closed
    timeline: {aspect: 1.25}
    funnel: {aspect: 0.95, narrow: 0.36} # narrow = width of the bottom as a share of the top
    reel: {aspect: 0.8, spins: 3, spin_s: 1.8}   # full turns before landing; spin length without `at`
  # Real-data and real-world elements. Card sizes follow `sizes` (s/m/l); text scales with the card.
  chart:                            # line chart that draws on
    max_points: 160                 # longer series are evenly downsampled (first and last kept)
    aspect: 0.66                    # height / width of the card
    bg: "#FFFFFF"
    text: "#15151C"
    muted: "#6B7280"
    grid: "rgba(21,21,28,.08)"
    line: {neutral: "#2563EB", up: "#1FA45B", down: "#E5484D"}   # neutral follows the trend
    line_px: 6
    bands: ["rgba(37,99,235,.10)", "rgba(245,158,11,.14)"]      # alternating band fills
    draw_s: 1.4                     # how long the line takes to draw
  unit:                             # waffle of squares
    fill: "#F2C94C"                 # highlighted (filled) squares
    empty: "rgba(21,21,28,.12)"
    gap: 0.18                       # gap as a share of a square
    fill_s: 1.0                     # all squares appear within this
  person: {bg: "#FFFFFF", text: "#15151C", muted: "#6B7280", aspect: 1.36,   # card height / width
           grow: 1.3}                                                      # height = size box height × grow
  news: {bg: "#FFFFFF", text: "#15151C", muted: "#6B7280", aspect: 0.36}
  notif: {bg: "#FFFFFF", text: "#15151C", muted: "#6B7280", app: "#1FA45B", aspect: 0.36}   # phone notification card
  logo: {bg: "#FFFFFF", pad: 0.12, max_px: 800}                  # pad = share of the sign's width
  screenshot: {max_px: 1400, bar: "#E7E7EC", bar_px: 46}
  cutout:
    # Background removal for kind=cutout: apple = macOS Vision subject lift (a Swift helper built
    # once into the cache; needs Xcode command-line tools), rembg = optional Python package
    # (`uv pip install "rembg[cpu]"`; kept out of the lock because it pins Pillow back),
    # auto = apple, then rembg. If neither works, or the mask looks wrong, the element is shown
    # as a photo card instead (with a warning).
    backend: auto
    min_coverage: 0.04              # subject must cover this share of the photo...
    max_coverage: 0.92              # ...and no more (else it's a background, not a subject)
    outline_px: 12                  # white sticker outline around the subject
    max_px: 900                     # longest side of the prepared image
    query_suffix: isolated          # tried first ("tempeh isolated"), then the plain query
  # Photos for cutout/photo/person/logo props. Your own file wins: put it in <dir>/<slug>/ named
  # <scene>-<n>[-anything].jpg|png|webp (n = the element's number in the scene, from 1), e.g.
  # specs/photos/judi-online/s1-1-bandar.png. Otherwise every provider below is searched in any
  # orientation and the vision check picks the best photo across all of them. Each fetch writes
  # projects/<slug>/photo-brief.md: props with no photo, props marked `own`, and stock photos the
  # vision check rated below brief_below (0-3), with the file name to save (`klip photos <spec>`).
  photos:
    dir: specs/photos
    # unsplash/pexels/pixabay need a .env key. openverse is left out: its anonymous rate limit
    # (minute-long waits) stalls a fetch that searches every prop; add it back if you have few keys.
    providers: [local, unsplash, pexels, pixabay, commons]
    per_provider: 4                 # candidates per provider and query shown to the vision check
    grow: 1.25                      # cutout/photo boxes are this much bigger than stage.sizes
    enough: 8                       # stop asking further providers once this many relevant photos are found
    brief_below: 3                  # stock photos rated below this go under "bisa lebih bagus"
    min_share: 0.6                  # validate warns when real pictures are fewer than this share of a
                                    # stage scene's object props (pictures + icons/stacks)

# ── Code scenes (visual.type "code", director mode) ─────────────────────────
# A scene whose look and motion are a file Claude writes against the scene kit `k`
# (docs/CODE-SCENES.md). The look bible (spec look_bible ← style look_bible ← code.look below) keeps
# every code scene in one art direction.
code:
  max_kb: 120                       # a scene file over this fails validation (keep scenes lean)
  # Fonts a look bible can name (fonts.display/body/mono/caption). package = @fontsource package in
  # renderer/, weights = files bundled into the composition, italic = also the italic files.
  fonts:
    jakarta:  {family: "Plus Jakarta Sans", package: plus-jakarta-sans, weights: [400, 600, 700, 800], italic: false}
    fraunces: {family: "Fraunces", package: fraunces, weights: [400, 700, 900], italic: true}
    fredoka:  {family: "Fredoka", package: fredoka, weights: [500, 600, 700], italic: false}
    anton:    {family: "Anton", package: anton, weights: [400], italic: false}
    mono:     {family: "JetBrains Mono", package: jetbrains-mono, weights: [400, 700], italic: false}
  # The base look bible (a style's look_bible and the spec's are merged over it). accent / emph
  # default to the style's accent_color / emphasis_color.
  look:
    palette: {bg: "#F3EDE2", paper: "#FFFBF2", ink: "#1D1B19", muted: "#8C8377", line: "#1D1B19"}
    fonts: {display: jakarta, body: jakarta, mono: mono, caption: null}   # caption null = the style's font
    texture: paper
    texture_strength: null
    line: 6
    motion: snappy
  # Default strength (0-1) per texture, and what each eases set holds (GSAP ease names).
  textures: {none: 0, paper: 0.55, watercolor: 0.6, halftone: 0.35, grain: 0.5, hud: 0.6, riso: 0.5}
  eases:
    snappy: {in: "power3.in", out: "power3.out", inOut: "power3.inOut", pop: "back.out(2.2)"}
    smooth: {in: "sine.in", out: "sine.out", inOut: "sine.inOut", pop: "power2.out"}
    bouncy: {in: "back.in(1.6)", out: "back.out(1.8)", inOut: "back.inOut(1.4)", pop: "elastic.out(1, 0.5)"}
  # The standard kit (k.headline, k.scrim, k.cast, k.chip, k.camera, k.type, k.count…): defaults so a
  # new scene starts legible and on-brand. headline.top is pushed below the series pill when it shows.
  kit:
    headline: {size: 92, hook_size: 104, top: 250, pill_gap: 30, line_height: 1.05, stagger_s: 0.06}
    # scrims: bands of the look's bg behind the headline (top_px tall) and behind the mascots +
    # captions (from bottom_above px above the captions' top, bottom_px tall)
    scrim: {top_px: 600, bottom_above: 330, bottom_px: 560}
    chip: {size: 52}
    camera_zoom: 1.08                 # k.camera: scale reached at the scene's end
    count_s: 1.2                      # k.count: default count-up length
    type_cps: 24                      # k.type: typewriter characters per second
    # mascot acting (rig.walk/enter/exit/jump/hop/turn/point): walking speed, step length in time,
    # body bob and foot lift per step, jump height, turn time, how long a point holds its pose
    act: {walk_px_s: 380, step_s: 0.26, bob_px: 10, foot_px: 14, lean_deg: 4, jump_px: 110, turn_s: 0.16, point_hold_s: 1.4}
  safe_top: 230                     # k.safe: below the TikTok top bar / branding strip
  safe_gap: 40                      # px kept clear above the captions
  # klip preview: stills per code scene (its start, each k.at cue, the middle, the end), at most
  # max_frames, each min_gap_s apart; sheet_width = px per still on the contact sheet.
  # klip preview then asks Claude (claude -p, your plan) to review the sheets: unreadable text,
  # overlaps, outside the safe area, empty frames, off-script stills, off-style, error boxes. Scenes
  # scoring below min_score (1-5) are flagged; qa.json carries the last review. model null = llm.claude.model.
  review: {enabled: true, model: null, timeout_s: 300, min_score: 4}
  preview:
    max_frames: 8
    min_gap_s: 0.3
    sheet_width: 360

# ── Real-world sources for stage elements ────────────────────────────────────
# person / logo (and cutout / photo with `who`) take a Wikipedia article's image; the licence and
# author go into credits.json and post.txt.
wikimedia:
  langs: [en, id]                   # Wikipedia editions to try, in order
  photo_px: 900                     # width of the downloaded portrait
  logo_px: 800
  allow_nonfree_logos: true         # most corporate logos are "non-free" (fair use) on Wikipedia;
                                    # false = leave such logos out. Non-free photos are never used.

# Wikimedia Commons file search (stage props): free licences only.
commons:
  photo_px: 1600                    # width of the downloaded rendition
  min_px: 600                       # skip files whose short side is smaller
  allow_sharealike: false           # CC BY-SA asks that adaptations (a cut-out in a video) share
                                    # alike; off keeps to CC0 / public domain / CC BY

# screenshot elements: a web page (or its Wayback Machine copy) captured with headless Chrome.
screenshot:
  chrome: null                      # path to Chrome; null = the headless Chrome HyperFrames downloads
  viewport: [1100, 1300]            # px (CSS) of the captured area; desktop layout, top of the page
  scale: 1.5                        # device pixel ratio (sharper text)
  wait_ms: 1500                     # after the page settles, before the capture
  timeout_s: 40

# ── Post text (post.txt) ─────────────────────────────────────────────────────
post:
  lowercase_hashtags: true          # write every hashtag in lowercase (#WargaNalar → #warganalar),
                                    # in the hashtag line and inside the caption; validate warns

# ── Background music ─────────────────────────────────────────────────────────
music:
  dir: assets/music                 # tracks in <dir>/<mood>/; spec music.mood picks the folder
  under_voice_db: 16                # music loudness relative to the voice, before ducking
  duck_threshold: 0.02              # sidechain compressor keyed by the voice
  duck_ratio: 8                     # net result ≈ -22 dB under speech
  fade_in_s: 0.8
  fade_out_s: 1.5

# ── Sound effects ────────────────────────────────────────────────────────────
# Placed automatically on visual moments, mixed under the voice. Defaults are synthesized by
# scripts/make_sfx.py; drop your own files with the same names (.wav/.mp3/.m4a/.ogg) into `dir`.
# A spec can turn them off with "sfx": false.
sfx:
  dir: assets/sfx
  # Gain applied to each file (files are peak-normalized to -1 dBFS; the voice sits ~-20 LUFS).
  gain_db:
    whoosh: -20
    pop: -20
    ding: -19
    riser: -24
    hit: -17
  # Which effect plays at which moment; null turns a moment off.
  events:
    hook_start: hit           # frame 0 impact (pattern interrupt)
    scene_cut: whoosh         # every scene change
    list_badge: pop           # "1/3" badge appears
    myth_riser: riser         # builds tension, ends on the fact reveal
    fact_reveal: hit
    stat_land: ding           # the counter reaches its number
    compare_vs: pop           # VS badge
    cta_icon: pop
    cta_ask: pop              # the cta action chip ("Simpan", "Komen di bawah") appears
    save_nudge: ding          # mid-video "simpan dulu" pill on list videos
    caption_page: null        # a pop on every caption page (busy; off by default)
    stage_pop: pop            # a stage element (cutout, icon, label, chart...) pops in
    stage_number: ding        # a stage number lands
    stage_highlight: null     # a yellow highlight box draws in
    stage_stamp: hit          # a stamp thumps down

# ── Final mix loudness ───────────────────────────────────────────────────────
loudness:
  target_lufs: -14.0
  true_peak_db: -1.5
  lra: 11.0

# ── Rendering (HyperFrames) ──────────────────────────────────────────────────
render:
  fps: 30
  quality: looks                    # draft | looks | delivery
  workers: auto                     # parallel Chrome workers (~256 MB RAM each)
  crf: 19                           # final H.264 encode quality (lower = better/larger)

# ── QA thresholds ────────────────────────────────────────────────────────────
qa:
  duration_tolerance: 0.15          # ±15% of target_duration_s
  max_duration_s: 120               # raised from 60 for long-form experiments
  loudness_range: [-15.5, -12.5]    # LUFS integrated
  max_true_peak_db: -1.0
  min_scene_voice_db: -45           # mean volume per scene's voice segment
  max_still_s: 1.0                  # black or frozen video longer than this fails

# ── Performance report (klip report) ─────────────────────────────────────────
# You copy numbers from TikTok/Instagram/YouTube analytics into stats_file (one row per posted
# video per platform; see stats.example.csv). `klip report` joins them with projects/<slug>/ and
# shows which choices (hook type, CTA, length, cut pace…) go with higher completion and watch time.
report:
  stats_file: stats.csv             # relative to the repo root (or an absolute path)
  output: projects/report.md        # markdown summary written on each run
  platform: tiktok                  # rows analysed by default (platforms measure differently); "all" = every row
  min_group: 3                      # groups with fewer videos are flagged "too few to trust"
  duration_bins_s: [35, 45]         # length buckets: <35 s, 35–45 s, ≥45 s
  shot_bins_s: [2.0, 2.5, 3.0]      # average-shot-length buckets (cut pace)
  # Hook type, guessed from the hook's narration: first type whose regex matches (case-insensitive,
  # checked in this order) wins, else "other". Types follow the writing guide in the /klip skill.
  hook_types:
    contradiction: ['salah besar', '\bsalah\b', '\bmitos\b', 'belum tentu', 'nggak selalu', 'tidak selalu', 'ternyata (nggak|bukan|tidak)', '\? *(bukan|keliru)']
    number: ['^\W*(ada\s+)?(\d+|dua|tiga|empat|lima|enam|tujuh)\s']
    cost: ['^kalau kamu', 'pantesan', 'jangan sampai', '\brugi\b']
    question: ['\?']

# ── Standalone script writing (klip new / klip script) ───────────────────────
# Not needed when you use Claude Code (/klip); there, Claude writes the script.
llm:
  # auto: Claude Code CLI if installed and logged in, else an OpenAI-compatible endpoint
  # (LLM_BASE_URL/LLM_MODEL/LLM_API_KEY in .env, e.g. Ollama at http://localhost:11434/v1).
  provider: auto                    # auto | claude | openai
  max_retries: 2                    # re-ask with the validation errors, then give up
  claude:
    model: null                     # null = Claude Code's default; e.g. "sonnet" or "opus"
    allow_web: true                 # let Claude use WebSearch/WebFetch to source facts
    timeout_s: 600
  openai:
    temperature: 0.7
    timeout_s: 300

# ── Visual styles ────────────────────────────────────────────────────────────
# A spec picks one with "style": "<name>". Other styles inherit everything from
# `default` and only list what they change (see `bold` below). Brand packs in
# brands/<name>/brand.yaml add more styles (see brands/example/).
styles:
  default:
    font_family: "Plus Jakarta Sans"
    text_color: "#FFFFFF"
    accent_color: "#FFD43B"         # active caption word, highlights
    emphasis_color: "#5EEAD4"       # spec `emphasis` words
    stroke_color: "#0B0B12"
    transition: punch               # punch (zoom-in jump cut) | fade
    media_dim: 0.28                 # darkening over b-roll (0–1) for readability
    shade_color: "#000000"          # tint of that darkening and of the myth/fact and compare cards
    myth_color: "#F43F5E"
    fact_color: "#22C55E"
    look_bible: {}                  # code scenes: this style's look bible (palette, fonts, texture…; see code.look)
    # Branding strip at the top of the safe zone: progress bar (left) + watermark (right).
    # Kept above y 250, where headlines/cards start, and below TikTok's top tabs.
    progress_bar:
      enabled: false                # a spec can override with "progress_bar": true/false (A/B test)
      top: 210                      # y of the bar's top edge
      height: 8
      color: null                   # null = accent_color
      track_opacity: 0.22           # unfilled part: text_color at this opacity
      scene_ticks: true             # small notches where scenes change ("chapters")
    watermark:
      file: null                    # image path from the repo root; null = no logo
      text: null                    # e.g. "@yourhandle", drawn left of the logo
      size: 56                      # px (square); the bar stops short of it
      top: 186
      right: 120                    # px from the canvas's right edge (safe zone ends at x 960)
      opacity: 0.85
      hide_on: [cta]                # templates where it's hidden
    series_pill:                    # needs spec "series"
      scenes: hook                  # hook (first scene only) | all (every scene except watermark.hide_on)
      left: 60
      top: 262
      font_size: 34
      font_weight: 700
      bg: null                      # null = accent_color
      color: null                   # null = stroke_color
      labels: {}                    # series key -> on-screen label; unlisted keys show in capitals
    end_card:                       # cta scene as a brand end card (logo, wordmark, tagline); null = off
      logo: null                    # images, repo-relative; the logo sits on a disc of disc_color
      wordmark: null
      tagline: null
      disc_color: null              # null = no disc
    # Action chip on the cta scene, picked by the cta scene's "cta_type" (no cta_type = no chip).
    # Icons are Lucide names. A "comment" cta shows its on_screen_text (the question) as the headline.
    cta:
      types:
        follow:  {icon: user-plus, label: "Follow"}
        save:    {icon: bookmark, label: "Simpan"}
        comment: {icon: message-circle, label: "Komen di bawah"}
        share:   {icon: send, label: "Kirim ke teman"}
      chip_font_size: 46
      chip_at_s: 0.5                # seconds into the cta scene the chip pops in
      question_font_size: 84        # comment headline (questions run 2-3 lines; the signoff is 1)
      # Brand end card with a comment question: logo disc and wordmark shrink to make room.
      compact_disc: 300             # px (normal 460)
      compact_word: 520             # wordmark width, px (normal 700)
    # How a final cta scene ends the video:
    #   card    = a full end card (end_card logo/wordmark if the style has them, else icon + headline)
    #   overlay = no card: the scene before keeps playing under the cta narration and a small badge
    #             (logo, text, action chip) slides up over it
    #   none    = the scene before keeps playing and nothing is added (the ask lives in post.txt)
    outro:
      mode: card
      text: null                    # badge line; null = the cta scene's on_screen_text (a comment
                                    # cta always shows its question)
      logo: true                    # overlay: end_card.logo (else the watermark image) in the badge
      chip: true                    # show the cta_type action chip
      captions: false               # caption the outro narration (off: its text is already on screen)
      badge_top: 1300               # overlay: y of the badge's top edge (above TikTok's caption area)
      font_size: 58                 # overlay: badge text size
      shrink: 0.85                  # overlay: a stage scene's props shrink to this (towards the
      lift_px: 40                   # title) and move up this far, to make room for the badge
      bg_opacity: 0.9               # overlay: shade_color behind the badge
    # Mascots: characters standing just above the captions who "explain" the video. A brand pack
    # lists its cast; each mascot is a folder of pose SVGs (<pose>.svg, `netral` required), drawn
    # facing the viewer and pointing to the viewer's right. Inside a pose: class "mouth" (closed) and
    # "mouth-open" (hidden) swap on each spoken word of the speaker, "eye" blinks, "wag" sways (a tail),
    # "nomirror" stays readable when the mascot is mirrored (text), "foot-l" / "foot-r" step when a code
    # scene's rig walks (unmarked, the two lowest ellipses are taken as feet). The props area shrinks to make
    # room. A scene's "mascot" in the spec picks the speaker and adds poses on words.
    mascot:
      # [{name, dir (relative to the brand pack), side: left|right, voice: female|male}]. A mascot
      # with a voice speaks the scenes narrated in that voice; a scene whose spec names it as the
      # speaker is narrated in its voice. A spec picks who appears with "mascots".
      cast: []
      height: 240                   # px
      gap_px: 6                     # above the stage captions
      inset_px: 10                  # from the safe zone's left/right edge
      clear_px: 44                  # the stage props end this far above the mascots (room for the
                                    # camera push-in and hanging label tags)
      speaker: {default: null}      # template → who speaks when the voice doesn't decide (no cast
                                    # voices, or one voice for both); default for the rest
      # Automatic reactions (spec poses come on top): the speaker points at each new big prop or
      # motion component (no more often than point_gap_s), everyone reacts to a stamp, and the
      # hook can open on a pose per mascot.
      auto:
        point: tunjuk               # pose name; null = off
        point_hold_s: 1.3
        point_gap_s: 3.0
        listen: null                # pose the other mascots take when the speaker first points in a
                                    # scene (a duet's listener leaning in); null = off
        stamp: {down: kaget, up: paham, neutral: kepo}   # stamp tone → pose; null = off
        stamp_hold_s: 1.5
        hook: {}                    # {mascot: pose} at the hook's start
        cta: {}                     # {mascot: pose} when the closing line starts (outro overlay/none)
      # Lip sync, flip-book style: on each spoken word of the speaker the pose's "mouth" hides and
      # its "mouth-open" shows for a share of the word (max open_s), twice for long words.
      mouth: {share: 0.6, open_s: 0.16, double_s: 0.42}
      blink_s: [2.6, 4.8]           # a blink every this many seconds (picked per blink)
      # Sticker look so the cast reads on every set (dark boards, phone screens, busy pages), in the
      # same cut-out language as the props: an outline of px in color around the whole character
      # (null = none), and a soft contact shadow under the feet (opacity; 0 = none) that stays put
      # while the body bobs.
      outline: {px: 6, color: "#FFFFFF"}
      ground: 0.32
      bob_px: 5                     # idle up/down
      bob_s: 1.4                    # half a bob
      enter_s: 0.35
      outro_lift_px: 80             # rise this far when an outro overlay badge slides up under them
    # "Simpan dulu biar nggak lupa" pill on list videos, shown when list item `at_item` starts
    # (first run of list_item scenes only). A spec can override with "save_nudge": true/false.
    save_nudge:
      enabled: true
      text: "Simpan dulu biar nggak lupa"
      icon: bookmark
      at_item: 2
      delay_s: 0.6                  # after the item starts (its 1/3 badge pops first)
      duration_s: 2.6               # on screen; shortened to fit the scene, skipped if under min_s
      min_s: 1.2
      top: 476                      # y; sits between the list number badge and the headline
      font_size: 38
      bg_opacity: 0.78              # shade_color behind the text
    # Designed cover.png (post stage): series pill, title (last line = keyword), subtitle,
    # logo + wordmark, over a darkened still of the hook's b-roll (else the first palette gradient).
    # Profile grids crop 9:16 covers
    # to the centre 3:4 (y 240–1680), so everything here stays inside that band.
    # Brand parts reuse series_pill.labels, end_card.logo/wordmark/disc_color and watermark.text.
    cover:
      enabled: true                 # false = a plain frame grab from the hook, as before
      pill_top: 380
      pill_font_size: 46
      text_top: 500                 # title + subtitle are centred vertically in text_top..text_bottom
      text_bottom: 1320
      width: 960                    # text block width, centred (x 60–1020)
      title_size: 130               # px; shrunk (down to title_min_size) to fit title_max_lines
      title_min_size: 84
      title_max_lines: 2            # for `title`; explicit `lines` are never wrapped
      keyword_size: 170             # last line: bigger, accent colour; shrunk to fit one line
      keyword_min_size: 90
      keyword_uppercase: true
      # Average glyph width (em) used to fit text without measuring it in the browser
      # (Plus Jakarta Sans 800, measured on the reference cover; raise if lines overflow).
      char_em: 0.55                 # mixed case
      caps_em: 0.72                 # capitals
      subtitle_size: 52
      subtitle_opacity: 0.75
      footer_y: 1540                # vertical centre of the logo + wordmark row
      logo_size: 88                 # disc diameter (end_card.disc_color), logo inside at ~85 %
      wordmark_height: 70
      media_dim: 0.62               # shade_color over the b-roll still (heavier than in the video)
      glow_opacity: 0.2             # accent_color glow rising from the bottom edge; 0 = off
      still_at_s: 0.6               # where in the hook's first clip the background still is taken
    caption:
      # TikTok safe zone (approximate; tune after a test upload): x 60–960, y 220–1450.
      top: 1180
      height: 270
      font_size: 80
      font_weight: 800
      stroke_px: 10
      max_words: 4                  # words per caption page
      max_page_ms: 1200
      highlight: color              # active word: color = turns accent_color; underline = an accent
                                    # marker sweeps in under it
      shadow: null                  # CSS text-shadow, e.g. "0 0 20px rgba(0,0,0,.5)"; null = none
      hide_gap_ms: null             # hide the caption in pauses longer than this; null = keep it up
      # Stage scenes (visual.type stage) use these on top: phrase pages under the stage, lower and
      # quieter (no stroke, soft shadow, marker under the active word), gone during pauses.
      stage:
        top: 1290
        height: 200
        font_size: 62
        stroke_px: 0
        shadow: "0 3px 0 rgba(0,0,0,.28), 0 0 20px rgba(0,0,0,.55), 0 0 6px rgba(0,0,0,.35)"
        max_words: 6
        max_page_ms: 2600
        highlight: underline
        hide_gap_ms: 450
        # On light sets (stage.backgrounds tone: light) white text washes out: dark text instead.
        on_light: {color: "#15151C", shadow: "0 0 14px rgba(255,255,255,.95), 0 0 4px rgba(255,255,255,.9)"}
    headline:
      font_size: 96
      font_weight: 800
      # Hook headline scale at frame 0, settling to 1 (the punch-in). The 900 px text block must
      # stay on the 1080 px canvas: keep it ≤ 1.2 (1.25 clipped long hooks at frame 0).
      hook_punch: 1.12
    palette:                        # gradient backgrounds, cycled per scene
      - ["#1E1B4B", "#7C3AED"]
      - ["#0F172A", "#0EA5E9"]
      - ["#3B0764", "#DB2777"]
      - ["#052E2B", "#10B981"]
      - ["#1C1917", "#F97316"]
  bold:
    accent_color: "#FF4D6D"
    emphasis_color: "#FFD43B"
    media_dim: 0.35
    caption:
      font_size: 88

# ── Brand packs ──────────────────────────────────────────────────────────────
# Each folder brands/<name>/ with a brand.yaml adds a style named <name> (logo, colours,
# series labels, end card). Image paths in brand.yaml are relative to its folder.
# brands/* is gitignored except brands/example, so your own brand stays private.
brands:
  dir: brands                       # relative to the repo root (or absolute)
