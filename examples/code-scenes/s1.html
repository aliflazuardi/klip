<canvas id="c" width="1080" height="1920"></canvas>
<h1 class="t">PAGI</h1>
<style>
canvas { position: absolute; inset: 0; }
.t { position: absolute; left: 0; right: 0; top: 420px; text-align: center; font: 400 260px var(--k-display); color: var(--k-ink); letter-spacing: .02em; }
</style>
<script>
const c = k.$("#c").getContext("2d");
const r = k.rand(3);
const stars = Array.from({ length: 140 }, () => [r() * 1080, r() * 1300, r() * 2 + 0.5]);
const sunUp = k.at("Matahari"), wake = k.at("bangun");
k.frame((t) => {
  const p = Math.min(1, Math.max(0, (t - sunUp) / 1.6));
  c.fillStyle = "#0E0F13"; c.fillRect(0, 0, 1080, 1920);
  for (const [x, y, s] of stars) { c.globalAlpha = 1 - p; c.fillStyle = "#fff"; c.fillRect(x, y, s, s); }
  c.globalAlpha = 1;
  const y = 1500 - p * 520;
  const g = c.createRadialGradient(540, y, 20, 540, y, 380);
  g.addColorStop(0, "#FFB066"); g.addColorStop(0.35, "#FF6A1A"); g.addColorStop(1, "rgba(255,106,26,0)");
  c.fillStyle = g; c.beginPath(); c.arc(540, y, 380, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "rgba(255,106,26,.5)"; c.lineWidth = 2;
  for (let i = 0; i < 18; i++) { const yy = 1250 + i * i * 2.2 + (t * 40) % 40; c.beginPath(); c.moveTo(0, yy); c.lineTo(1080, yy); c.stroke(); }
});
k.tl.from(".t", { y: 80, opacity: 0, duration: 0.5, ease: k.look.ease.out }, wake);
</script>
