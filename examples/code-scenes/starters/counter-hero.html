<!-- Starter: one big number. It counts up inside a ring that fills, with a label under it; a burst of
     ticks when it lands. Edit CFG (Indonesian number format). -->
<div class="num"></div><div class="lab"></div>
<style>
.num { position: absolute; left: 0; right: 0; top: 645px; text-align: center; font: 800 190px/1 var(--k-display);
       letter-spacing: -0.05em; color: var(--k-ink); }
.lab { position: absolute; left: 100px; right: 100px; top: 1110px; text-align: center; font: 700 46px/1.2 var(--k-body); color: var(--k-muted); }
</style>
<script>
const CFG = { to: 72, from: 0, decimals: 0, prefix: "", suffix: "%", ring: 0.72, label: "dari semua yang disurvei", at: null };
const { cam } = k.stage();
k.headline();
const P = k.look.palette, cx = 540, cy = 740, R = 330;
k.el("circle", { cx, cy, r: R, fill: "none", stroke: P.ink, "stroke-width": 34, opacity: 0.08 }, cam);
const ring = k.el("circle", { cx, cy, r: R, fill: "none", stroke: P.accent, "stroke-width": 34, "stroke-linecap": "round",
  transform: `rotate(-90 ${cx} ${cy})` }, cam);
const t0 = (CFG.at && k.find(CFG.at)) ?? k.beat(0.2), dur = 1.4, len = 2 * Math.PI * R;
gsap.set(ring, { strokeDasharray: len, strokeDashoffset: len });
k.tl.to(ring, { strokeDashoffset: len * (1 - CFG.ring), duration: dur, ease: "power2.out" }, t0);
k.count(k.$(".num"), { to: CFG.to, from: CFG.from, at: t0, dur, decimals: CFG.decimals, prefix: CFG.prefix, suffix: CFG.suffix });
k.$(".lab").textContent = CFG.label;
k.tl.from(".lab", { y: 30, opacity: 0, duration: 0.3 }, t0 + 0.3);
for (let i = 0; i < 12; i++) {                               // the landing burst
  const a = (i / 12) * Math.PI * 2, tick = k.el("line", { x1: cx + Math.cos(a) * (R + 40), y1: cy + Math.sin(a) * (R + 40),
    x2: cx + Math.cos(a) * (R + 90), y2: cy + Math.sin(a) * (R + 90), stroke: P.accent, "stroke-width": 10, "stroke-linecap": "round", opacity: 0 }, cam);
  k.tl.fromTo(tick, { opacity: 1, scale: 0.6, svgOrigin: `${cx} ${cy}` }, { opacity: 0, scale: 1.15, svgOrigin: `${cx} ${cy}`, duration: 0.5,
    ease: "power2.out", immediateRender: false }, t0 + dur - 0.05);
}
k.tl.fromTo(".num", { scale: 1 }, { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1, immediateRender: false, transformOrigin: "50% 50%" }, t0 + dur);
k.cast();
</script>
