const accent = new THREE.Color(P.accent), pop = gsap.parseEase("back.out(2)"), io = gsap.parseEase("power3.inOut");
const clamp = (v) => Math.max(0, Math.min(1, v));
const times = CFG.places.map((p, i) => (p.at && k.find(p.at)) ?? k.beat(0.08 + 0.84 * i / Math.max(1, CFG.places.length)));
const pos = CFG.places.map((p) => new THREE.Vector3(X(p.lon), 0.36, Z(p.lat)));
const pillars = pos.map((v) => {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 1, 16), new THREE.MeshBasicMaterial({ color: accent }));
  m.position.copy(v); m.scale.set(1, 0.001, 1); scene.add(m);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.42, 32), new THREE.MeshBasicMaterial({ color: accent, transparent: true, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.position.set(v.x, 0.37, v.z); scene.add(ring);
  return { m, ring };
});
const arcs = CFG.arcs ? pos.slice(1).map((b) => {
  const a = pos[0], mid = a.clone().lerp(b, 0.5); mid.y = 1 + a.distanceTo(b) * 0.25;
  const g = new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(a, mid, b), 64, 0.05, 6);
  g.setDrawRange(0, 0); scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: accent }))); return g;
}) : [];
const labels = CFG.places.map((p) => k.el("div", { class: "pl", text: p.name }, k.$("#lbl")));
// camera: a wide tilted view, then a glide to each place as it comes in
const wide = { t: new THREE.Vector3(X(118), 0, Z(-2.5)), d: CFG.far };
const stop = (i) => ({ t: pos[i].clone(), d: CFG.near });
const view = (t) => {
  let v = wide;
  times.forEach((ti, i) => {
    const p = io(clamp((t - ti + 0.5) / 1.1));
    if (p > 0) v = { t: v.t.clone().lerp(stop(i).t, p), d: v.d + (stop(i).d - v.d) * p };
  });
  return v;
};
k.frame((t) => {
  const v = view(t), drift = t * 0.04;
  cam.position.set(v.t.x + Math.sin(drift) * v.d * 0.2, v.d * Math.sin(CFG.tilt), v.t.z + v.d * Math.cos(CFG.tilt));
  cam.lookAt(v.t);
  pillars.forEach(({ m, ring }, i) => {
    const p = clamp((t - times[i]) / 0.5), h = 0.001 + CFG.pillar * pop(p);
    m.scale.set(1, h, 1); m.position.y = 0.36 + h / 2;
    const r = clamp((t - times[i]) / 1.2) % 1; ring.scale.setScalar(1 + 3 * r); ring.material.opacity = p > 0 ? 0.8 * (1 - r) : 0;
  });
  arcs.forEach((g, i) => g.setDrawRange(0, Math.round(g.index.count * clamp((t - times[i + 1] + 0.3) / 0.8) / 3) * 3));
  renderer.render(scene, cam);
  labels.forEach((el, i) => {
    const q = pos[i].clone().setY(CFG.pillar + 0.9).project(cam), x = (q.x + 1) / 2 * 1080, y = (1 - q.y) / 2 * 1920;
    el.style.left = x + "px"; el.style.top = y + "px";
    el.style.opacity = t >= times[i] + 0.2 && q.z < 1 && y > k.safe.y + 200 && y < k.safe.captionTop ? 1 : 0;
  });
});
k.headline();
k.cast();
</script>
